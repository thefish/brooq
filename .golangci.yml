# golangci-lint v2 (пин: v2.14.0, ставится через `go install` — см. Makefile, bin-deps).
# Единственное исключение — сгенерированный OpenAPI-клиент (R1-G): он не
# рукописный код, отчёты с него не нужны. Файл дополнительно закрыт штатным
# правилом `generated` (заголовок «DO NOT EDIT»), правило — на будущее.
version: "2" # Указывает, что мы используем новый синтаксис v2

linters:
  # Вместо старого `disable-all: true` теперь используется параметр default
  # none означает, что мы запускаем только то, что явно перечислим в enable
  default: none

  enable:
    - govet
    - staticcheck
    - errcheck
    - revive # Наш "любимый" линтер
    - bodyclose
    - gocritic
    - gosec

  # Новый блок настроек v2 (вместо старого linters-settings)
  settings:
    revive:
      rules:
        # Убиваем var-naming, который требовал писать HTTPCrmDetailProvider
        - name: var-naming
          disabled: true

        # Для кучи убираем линтеры пустых строк, если они были включены
        - name: argument-limit
          disabled: true

    gocritic:
      # Настройки тегов или конкретных проверок gocritic
      settings:
        captLocal: # Пример настройки конкретного чекера внутри gocritic
          paramsOnly: true
        hugeParam:
          # Поднимаем лимит до 160 или 256 байт.
          # Теперь структуры до этого размера (включая вашу SessionContext)
          # линтер будет игнорировать.
          sizeThreshold: 160
      # Если нужно включить экспериментальные или специфичные проверки gocritic
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - unnamedResult # Отключаем то, что бесит конкретно в gocritic

    gosec:
      # Настройки gosec (опционально)
      # Можно отключить параноидальные правила, если они начнут спамить.
      # Например, G104 ругается на любые непроверенные ошибки (но у нас для этого уже есть errcheck)
      excludes:
        - G104
